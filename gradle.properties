org.gradle.warning.mode=all
# Keep Gradle/IDE on JDK 21 (matches compileOptions; avoids broken Cursor Java LS imports)
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# Application variables
APP_ID=biz.playr
APP_NAME=Playr
APP_NAME_MODIFIER=
APP_NAMESPACE=biz.playr
# true = app actively attempts to start when the device is turned on
# false = app does not attempt to start when the device is turned on; for use with a proffesional displays
AUTO_START=true
# true = local auto-recovery after crash / stale player; false = stay down (Pro Display).
# Watchdog always runs; server-commanded restart is not gated by this flag.
RESTART=true
PLAYR_URLS=www.playr.biz|play.playr.biz|playr.biz